spring:
  application:
    name: aggregator
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
      fail-fast: false
      request-connect-timeout: 1000
      request-read-timeout: 1000

aggregator:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: telemetry-aggregator
    topics:
      sensors: telemetry.sensors.v1
      snapshots: telemetry.snapshots.v1

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
