server:
  port: 8080

spring:
  application:
    name: collector
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
      fail-fast: false
      request-connect-timeout: 1000
      request-read-timeout: 1000

collector:
  grpc:
    port: 59091
  kafka:
    bootstrap-servers: localhost:9092
    topics:
      sensors: telemetry.sensors.v1
      hubs: telemetry.hubs.v1

grpc:
  server:
    port: 59091

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
